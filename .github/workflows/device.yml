name: Device verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start isolated SMB test fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y samba
          sudo useradd -M ofptest
          printf 'fixture-password\nfixture-password\n' | sudo smbpasswd -a -s ofptest
          sudo mkdir -p /srv/ofp-fixtures
          sudo chown ofptest /srv/ofp-fixtures
          printf '[global]\nserver min protocol = SMB2\n[fixtures]\npath = /srv/ofp-fixtures\nread only = no\nvalid users = ofptest\n' | sudo tee /etc/samba/smb.conf
          sudo systemctl restart smbd
      - name: Build test APK
        run: chmod +x gradlew && ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Download/openfilepower-screenshots screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-reports-and-screenshots
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/
